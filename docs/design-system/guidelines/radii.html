<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{padding:24px 28px;box-sizing:border-box;min-height:100vh}*{box-sizing:border-box}.m{font-family:var(--font-mono);font-size:11px;color:var(--ink3)}.lbl{font:var(--t-label);letter-spacing:var(--t-label-track);text-transform:uppercase;color:var(--ink3)}</style></head><body><div style="display:grid;grid-template-columns:repeat(4,1fr);gap:16px"><div style="display:flex;flex-direction:column;gap:8px"><div style="height:64px;border:1px solid var(--ink3);border-radius:999px;"></div><span style="font-family:var(--font-mono);font-size:11.5px">--r-pill 999</span><span style="font-size:12px;color:var(--ink3)">Botões, chips, busca, abas</span></div><div style="display:flex;flex-direction:column;gap:8px"><div style="height:64px;border:1px solid var(--ink3);border-radius:16px;"></div><span style="font-family:var(--font-mono);font-size:11.5px">--r-field 16</span><span style="font-size:12px;color:var(--ink3)">Campos</span></div><div style="display:flex;flex-direction:column;gap:8px"><div style="height:64px;border:1px solid var(--ink3);border-radius:20px;"></div><span style="font-family:var(--font-mono);font-size:11.5px">--r-card 20</span><span style="font-size:12px;color:var(--ink3)">Card em repouso</span></div><div style="display:flex;flex-direction:column;gap:8px"><div style="height:64px;border:1px solid var(--ink3);border-radius:30px;border-bottom:0;border-bottom-left-radius:0;border-bottom-right-radius:0"></div><span style="font-family:var(--font-mono);font-size:11.5px">--r-sheet 30</span><span style="font-size:12px;color:var(--ink3)">Topo da folha</span></div></div></body></html>
