<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{padding:24px 28px;box-sizing:border-box;min-height:100vh}*{box-sizing:border-box}.m{font-family:var(--font-mono);font-size:11px;color:var(--ink3)}.lbl{font:var(--t-label);letter-spacing:var(--t-label-track);text-transform:uppercase;color:var(--ink3)}</style></head><body><div style="display:flex;flex-direction:column;gap:20px"><div style="display:grid;grid-template-columns:120px 1fr;gap:12px;align-items:center"><span style="font-family:var(--font-mono);font-size:11.5px">--hairline 1</span><span style="height:1px;background:var(--line)"></span></div><div style="display:grid;grid-template-columns:120px 1fr;gap:12px;align-items:center"><span style="font-family:var(--font-mono);font-size:11.5px">--strike 1,5</span><span style="font-size:15px;color:var(--ink3);position:relative;justify-self:start">Pagar fatura do cartão<span style="position:absolute;left:0;right:0;top:53%;height:1.5px;background:var(--ink2)"></span></span></div><div style="display:grid;grid-template-columns:120px 1fr;gap:12px;align-items:center"><span style="font-family:var(--font-mono);font-size:11.5px">--track 3</span><span style="height:3px;background:var(--line);border-radius:999px;overflow:hidden"><span style="display:block;width:71%;height:100%;background:var(--accent);border-radius:999px"></span></span></div></div></body></html>
