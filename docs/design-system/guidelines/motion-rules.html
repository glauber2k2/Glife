<!-- @dsCard group="Motion" viewport="700x150" name="Regras de movimento" subtitle="Stagger, entrada, toque" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{padding:24px 28px;box-sizing:border-box;min-height:100vh}*{box-sizing:border-box}.m{font-family:var(--font-mono);font-size:11px;color:var(--ink3)}.lbl{font:var(--t-label);letter-spacing:var(--t-label-track);text-transform:uppercase;color:var(--ink3)}</style></head><body><div style="display:grid;grid-template-columns:repeat(4,1fr);gap:16px"><div style="display:flex;flex-direction:column;gap:6px;padding-top:12px;border-top:1px solid var(--line)"><span style="font-family:var(--font-mono);font-size:12px">--stagger</span><span style="font:var(--t-sub)">40ms</span><span style="font-size:12.5px;color:var(--ink2);line-height:1.4">entre itens de lista</span></div><div style="display:flex;flex-direction:column;gap:6px;padding-top:12px;border-top:1px solid var(--line)"><span style="font-family:var(--font-mono);font-size:12px">--enter-y</span><span style="font:var(--t-sub)">12px</span><span style="font-size:12.5px;color:var(--ink2);line-height:1.4">deslocamento de entrada</span></div><div style="display:flex;flex-direction:column;gap:6px;padding-top:12px;border-top:1px solid var(--line)"><span style="font-family:var(--font-mono);font-size:12px">--press</span><span style="font:var(--t-sub)">0,96</span><span style="font-size:12.5px;color:var(--ink2);line-height:1.4">afundar no toque (0,9 em controles pequenos)</span></div><div style="display:flex;flex-direction:column;gap:6px;padding-top:12px;border-top:1px solid var(--line)"><span style="font-family:var(--font-mono);font-size:12px">reduzido</span><span style="font:var(--t-sub)">≈0 ms</span><span style="font-size:12.5px;color:var(--ink2);line-height:1.4">prefers-reduced-motion: sem deslocamento</span></div></div></body></html>
