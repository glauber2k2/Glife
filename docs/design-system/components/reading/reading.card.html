<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<style>body{padding:20px 24px;box-sizing:border-box}*{box-sizing:border-box}</style></head><body><div id="root"></div>
<script type="text/babel">
const NS = window.GlifeDesignSystem_55cfbd;
const R = () => { const { useState } = React; const { Verse, SelectionToolbar } = NS;
const [hl,setHl]=useState({0:0}),[a,setA]=useState(0),[c,setC]=useState(0);
const V=['O Senhor é o meu pastor; nada me faltará.','Deitar-me faz em verdes pastos, guia-me mansamente a águas tranquilas.','Refrigera a minha alma; guia-me pelas veredas da justiça.'];
return (<div style={{position:'relative',height:250,overflow:'hidden',padding:'0 4px'}}>{V.map((t,i)=><Verse key={i} number={i+1} text={t} highlight={hl[i]??null} active={a===i} onClick={()=>{setA(i);setHl({...hl,[i]:c});}} />)}
<SelectionToolbar open={a!==null} color={c} onColor={(i)=>{setC(i);if(a!==null)setHl({...hl,[a]:i});}} actions={[{icon:'pencil-line',label:'Anotar'},{icon:'copy',label:'Copiar'},{icon:'trash-2',label:'Remover marca',onClick:()=>{const h={...hl};delete h[a];setHl(h);setA(null);}},{icon:'check',label:'Pronto',onClick:()=>setA(null)}]} /></div>); };
ReactDOM.createRoot(document.getElementById('root')).render(<R />);
</script></body></html>
