<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Protótipo Glife</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=DM+Mono:wght@400;500&family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,500;1,7..72,400&display=swap">
<style>
/* Layout: índice de telas à esquerda · celular 390×844 no centro · ficha da tela à direita. Tokens = Glife Cobalto v1.0 + tema escuro derivado. */
:root{
  --canvas:#DCE1EA; --bg:#F1F3F6; --card:#FFFFFF; --card-2:#F7F8FA;
  --fg:#0E1116; --fg-2:#4B5260; --fg-3:#636A77; --fg-4:#9AA0AB;
  --line:#ECEEF2; --line-2:#E3E7EC; --border:#C9CED8; --track:#E6E9EE;
  --accent:#2D5BFF; --accent-press:#2349DB; --accent-text:#2D5BFF; --on-accent:#FFFFFF;
  --tonal:#E2E8FF; --tonal-fg:#1F3FB8; --hl:#F3F5FF; --c200:#C9D4FF;
  --inverse:#0E1116; --inverse-fg:#FFFFFF; --inverse-2:#9DB2FF; --inverse-3:#9AA0AB;
  --ok:#15803D; --ok-soft:#DCF2E4; --warn:#7A5000; --warn-soft:#FCEFD6; --bad:#A3322A; --bad-strong:#C2453D; --bad-soft:#FBE3E1;
  --scrim:rgba(14,17,22,.36);
  --sh-1:0 1px 2px rgba(14,17,22,.04),0 6px 16px -8px rgba(14,17,22,.16);
  --sh-2:0 14px 32px -12px rgba(14,17,22,.32);
  --sh-3:0 -12px 40px -14px rgba(14,17,22,.34),0 18px 40px -16px rgba(14,17,22,.3);
  --sh-seg:0 1px 3px rgba(14,17,22,.12);
  --sh-nav:0 12px 32px -12px rgba(14,17,22,.3),0 0 0 1px rgba(14,17,22,.04);
  --sh-fab:0 10px 22px -8px rgba(45,91,255,.7);
  --sh-knob:0 2px 6px rgba(14,17,22,.2);
  --soft-l:.95; --soft-c:.035; --strong-l:.47; --strong-c:.13; --chart-l:.62; --chart-c:.12;
  --hlt-l:.92; --hlt-c:.07;
  --frame:#0A0A0A;
  --font:'Outfit',system-ui,-apple-system,'Segoe UI',sans-serif;
  --mono:'DM Mono',ui-monospace,'Cascadia Mono',monospace;
  --serif:'Literata',Georgia,'Times New Roman',serif;
  --std:cubic-bezier(.2,0,0,1); --enter:cubic-bezier(.05,.7,.1,1); --exit:cubic-bezier(.3,0,.8,.15); --spring:cubic-bezier(.34,1.56,.64,1); --loop:cubic-bezier(.45,0,.55,1);
  --slow:1;
  --sb:50px;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --canvas:#05070B; --bg:#0C0F15; --card:#161B24; --card-2:#1D2330;
  --fg:#EEF1F6; --fg-2:#C3C9D4; --fg-3:#98A1B0; --fg-4:#646D7D;
  --line:#232A37; --line-2:#232A37; --border:#3A4252; --track:#262D3A;
  --accent:#3F68FF; --accent-press:#2F57EE; --accent-text:#8FA7FF; --on-accent:#FFFFFF;
  --tonal:#1B2650; --tonal-fg:#B7C5FF; --hl:#131A31; --c200:#2C3B78;
  --inverse:#131F57; --inverse-fg:#FFFFFF; --inverse-2:#9DB2FF; --inverse-3:#AEB8DA;
  --ok:#62D394; --ok-soft:#10301F; --warn:#F1C46B; --warn-soft:#33270F; --bad:#FF948A; --bad-strong:#FF948A; --bad-soft:#3B1917;
  --scrim:rgba(0,0,0,.58);
  --sh-1:0 1px 2px rgba(0,0,0,.3),0 6px 16px -8px rgba(0,0,0,.6);
  --sh-2:0 14px 32px -12px rgba(0,0,0,.7);
  --sh-3:0 -12px 40px -14px rgba(0,0,0,.7),0 18px 40px -16px rgba(0,0,0,.6);
  --sh-seg:0 1px 3px rgba(0,0,0,.5);
  --sh-nav:0 12px 32px -12px rgba(0,0,0,.8),0 0 0 1px rgba(255,255,255,.06);
  --sh-fab:0 10px 22px -8px rgba(63,104,255,.6);
  --sh-knob:0 2px 6px rgba(0,0,0,.5);
  --soft-l:.31; --soft-c:.05; --strong-l:.85; --strong-c:.10; --chart-l:.72; --chart-c:.12;
  --hlt-l:.40; --hlt-c:.07;
  --frame:#1A1D24;
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --canvas:#05070B; --bg:#0C0F15; --card:#161B24; --card-2:#1D2330;
  --fg:#EEF1F6; --fg-2:#C3C9D4; --fg-3:#98A1B0; --fg-4:#646D7D;
  --line:#232A37; --line-2:#232A37; --border:#3A4252; --track:#262D3A;
  --accent:#3F68FF; --accent-press:#2F57EE; --accent-text:#8FA7FF; --on-accent:#FFFFFF;
  --tonal:#1B2650; --tonal-fg:#B7C5FF; --hl:#131A31; --c200:#2C3B78;
  --inverse:#131F57; --inverse-fg:#FFFFFF; --inverse-2:#9DB2FF; --inverse-3:#AEB8DA;
  --ok:#62D394; --ok-soft:#10301F; --warn:#F1C46B; --warn-soft:#33270F; --bad:#FF948A; --bad-strong:#FF948A; --bad-soft:#3B1917;
  --scrim:rgba(0,0,0,.58);
  --sh-1:0 1px 2px rgba(0,0,0,.3),0 6px 16px -8px rgba(0,0,0,.6);
  --sh-2:0 14px 32px -12px rgba(0,0,0,.7);
  --sh-3:0 -12px 40px -14px rgba(0,0,0,.7),0 18px 40px -16px rgba(0,0,0,.6);
  --sh-seg:0 1px 3px rgba(0,0,0,.5);
  --sh-nav:0 12px 32px -12px rgba(0,0,0,.8),0 0 0 1px rgba(255,255,255,.06);
  --sh-fab:0 10px 22px -8px rgba(63,104,255,.6);
  --sh-knob:0 2px 6px rgba(0,0,0,.5);
  --soft-l:.31; --soft-c:.05; --strong-l:.85; --strong-c:.10; --chart-l:.72; --chart-c:.12;
  --hlt-l:.40; --hlt-c:.07;
  --frame:#1A1D24;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--canvas);color:var(--fg);font-family:var(--font);-webkit-font-smoothing:antialiased;font-size:16px;line-height:1.4;margin:0;transition:background-color 300ms linear}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:inherit}
input,textarea,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent-text);outline-offset:2px}
.tn{font-variant-numeric:tabular-nums}

/* ============ Página do protótipo ============ */
.page{display:grid;grid-template-columns:288px minmax(0,1fr) 336px;min-height:100%;padding-left:max(0px,env(safe-area-inset-left,0px));padding-right:max(0px,env(safe-area-inset-right,0px))}
.side{position:sticky;top:0;height:100vh;overflow:auto;padding:28px 20px 28px 24px;display:flex;flex-direction:column;gap:22px;scrollbar-width:thin}
.brand{display:flex;align-items:center;gap:10px}
.brand b{font-size:22px;font-weight:600;letter-spacing:-.8px}
.brand small{display:block;font-family:var(--mono);font-size:11.5px;color:var(--fg-3);letter-spacing:.2px}
.ctl{display:flex;flex-direction:column;gap:8px}
.ctl-l{font-size:12px;font-weight:600;color:var(--fg-3);letter-spacing:.4px;text-transform:uppercase}
.ctl-row{display:flex;align-items:center;justify-content:space-between;gap:12px;font-size:14px;min-height:36px}
.find{height:40px;border-radius:999px;background:var(--card);display:flex;align-items:center;gap:8px;padding:0 14px;color:var(--fg-3)}
.find input{border:0;background:transparent;outline:0;flex:1;min-width:0;font-size:14px;color:var(--fg)}
.idx{display:flex;flex-direction:column;gap:16px}
.idx-g{display:flex;flex-direction:column;gap:2px}
.idx-h{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:600;color:var(--fg-3);letter-spacing:.4px;text-transform:uppercase;padding:0 10px 4px}
.idx-h span{font-family:var(--mono);font-weight:400;letter-spacing:0;text-transform:none;margin-left:auto}
.idx-b{display:flex;align-items:center;gap:10px;min-height:34px;padding:0 10px;border-radius:10px;font-size:14px;color:var(--fg-2);transition:background-color 160ms linear,color 160ms linear}
.idx-b:hover{background:color-mix(in srgb,var(--card) 70%,transparent);color:var(--fg)}
.idx-b.on{background:var(--card);color:var(--fg);font-weight:600;box-shadow:var(--sh-seg)}
.idx-b .dot{width:6px;height:6px;border-radius:9px;background:oklch(var(--chart-l) var(--chart-c) var(--h,260));flex:none}
.stage{display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding:24px 16px;min-width:0;gap:18px}
.notes{position:sticky;top:0;height:100vh;overflow:auto;padding:28px 24px 28px 8px;display:flex;flex-direction:column;gap:18px;scrollbar-width:thin}
.nt-card{background:var(--card);border-radius:24px;padding:20px;display:flex;flex-direction:column;gap:14px}
.nt-eb{font-family:var(--mono);font-size:12px;color:var(--accent-text)}
.nt-t{font-size:24px;line-height:28px;font-weight:600;letter-spacing:-.6px;margin:0;text-wrap:balance}
.nt-d{font-size:14px;line-height:21px;color:var(--fg-2);margin:0;text-wrap:pretty}
.nt-r{font-family:var(--mono);font-size:12px;color:var(--fg-3);background:var(--bg);border-radius:8px;padding:6px 10px;align-self:flex-start;max-width:100%;overflow-wrap:anywhere}
.nt-h{font-size:12px;font-weight:600;color:var(--fg-3);letter-spacing:.4px;text-transform:uppercase;margin:4px 0 -4px}
.nt-ul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:6px;font-size:13.5px;line-height:19px;color:var(--fg-2)}
.nt-ul li::marker{color:var(--fg-4)}
.nt-states{display:flex;flex-wrap:wrap;gap:6px}
.nt-st{height:32px;padding:0 12px;border-radius:999px;background:var(--bg);font-size:13px;font-weight:500;color:var(--fg-2)}
.nt-st.on{background:var(--tonal);color:var(--tonal-fg);font-weight:600}
.legend{font-size:12.5px;line-height:18px;color:var(--fg-3)}
.mtop{display:none}
.phone-wrap{flex:none;position:relative}
.phone{width:410px;height:864px;border-radius:60px;background:var(--frame);padding:10px;box-shadow:0 40px 80px -40px rgba(14,17,22,.5);transform-origin:top left;position:absolute;left:0;top:0}
.island{position:absolute;top:21px;left:50%;margin-left:-55px;width:110px;height:32px;border-radius:20px;background:#000;z-index:80;pointer-events:none}
.mini-sw{display:flex;padding:3px;border-radius:12px;background:var(--track);position:relative}
.mini-sw button{flex:1;height:30px;border-radius:9px;font-size:13px;font-weight:500;color:var(--fg-2);position:relative;z-index:1;transition:color 200ms linear}
.mini-sw button.on{color:var(--fg);font-weight:600}
.mini-sw i.ind{position:absolute;top:3px;bottom:3px;left:3px;border-radius:9px;background:var(--card);box-shadow:var(--sh-seg);transition:transform calc(340ms*var(--slow)) var(--std)}

@media (max-width:1240px){
  .page{grid-template-columns:268px minmax(0,1fr)}
  .notes{position:static;height:auto;grid-column:2;padding:0 16px 40px;max-width:520px;justify-self:center;width:100%}
}
body.webmode .page{grid-template-columns:268px minmax(0,1fr)}
body.webmode .notes{position:static;height:auto;grid-column:2;padding:0 16px 40px;max-width:640px;justify-self:center;width:100%}
@media (max-width:860px){
  .page{display:block}
  .side{position:fixed;inset:0 auto 0 0;width:min(320px,88vw);z-index:200;background:var(--canvas);transform:translateX(-102%);transition:transform 320ms var(--std);box-shadow:var(--sh-3);padding-top:calc(20px + env(safe-area-inset-top,0px))}
  .side.open{transform:none}
  .mtop{display:flex;align-items:center;gap:10px;height:52px;padding:0 max(16px,env(safe-area-inset-left,0px)) 0 max(16px,env(safe-area-inset-left,0px));position:sticky;top:env(safe-area-inset-top,0px);z-index:150;background:var(--canvas)}
  body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:160;background:var(--canvas)}
  .mtop .grow{flex:1;min-width:0;font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .mbtn{height:36px;padding:0 12px;border-radius:999px;background:var(--card);display:flex;align-items:center;gap:6px;font-size:13px;font-weight:600}
  .stage{padding:0}
  .phone-wrap{width:100% !important;height:calc(100dvh - 52px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px)) !important}
  .phone{position:relative;width:100%;height:100%;border-radius:0;padding:0;box-shadow:none;transform:none !important;background:var(--bg)}
  .phone .app{border-radius:0}
  .island{display:none}
  .notes{padding:20px 16px 40px;max-width:none}
  .scrim-side{position:fixed;inset:0;background:var(--scrim);z-index:190}
}

/* ============ App (dentro do celular) ============ */
.app{position:relative;width:100%;height:100%;border-radius:50px;overflow:hidden;background:var(--bg);color:var(--fg);isolation:isolate;font-size:16px;line-height:1.35}
.app.bare{--sb:14px}
.statusbar{position:absolute;inset:0 0 auto;height:50px;display:flex;align-items:center;justify-content:space-between;padding:0 32px 0 38px;font-size:15px;font-weight:600;z-index:70;pointer-events:none;color:var(--fg)}
.statusbar span{display:flex;gap:5px;align-items:center}
.app.bare .statusbar{display:none}
.stack{position:absolute;inset:0}
.scr{position:absolute;inset:0;background:var(--bg);overflow:hidden;will-change:transform}
.scr.ink{background:var(--inverse);color:var(--inverse-fg)}
.scroll{height:100%;overflow-y:auto;overflow-x:hidden;scrollbar-width:none;overscroll-behavior:contain}
.scroll::-webkit-scrollbar{display:none}
.pad{padding:calc(var(--sb) + 6px) 20px 132px;display:flex;flex-direction:column;gap:24px}
.pad.nb{padding-bottom:40px}
.pad.cta{padding-bottom:120px}
.pad.g16{gap:16px}
.pad.g20{gap:20px}
.dimmer{position:absolute;inset:0;background:var(--scrim);opacity:0;pointer-events:none;z-index:20}
.app :is(button,[data-go],[data-act],[data-sheet],[data-tab],[data-back],[data-close]){transition:transform calc(380ms*var(--slow)) var(--spring),background-color 200ms linear,color 200ms linear,box-shadow 200ms linear,opacity 200ms linear;-webkit-tap-highlight-color:transparent;cursor:pointer}
.app :is(button,[data-go],[data-act],[data-sheet],[data-tab],[data-back],[data-close]):active{transform:scale(.96);transition:transform calc(90ms*var(--slow)) var(--std)}
.app .noscale:active{transform:none}

/* tipografia */
.t-num{font-size:44px;line-height:46px;font-weight:700;letter-spacing:-2px;font-variant-numeric:tabular-nums}
.t-big{font-size:40px;line-height:44px;font-weight:700;letter-spacing:-1.6px;font-variant-numeric:tabular-nums}
.t-1{font-size:32px;line-height:36px;font-weight:600;letter-spacing:-1.2px;margin:0;text-wrap:balance}
.t-2{font-size:24px;line-height:30px;font-weight:600;letter-spacing:-.6px;margin:0;text-wrap:balance}
.t-3{font-size:20px;line-height:26px;font-weight:600;letter-spacing:-.4px;margin:0}
.t-e{font-size:16px;line-height:22px;font-weight:600}
.t-b{font-size:16px;line-height:24px}
.t-s{font-size:14px;line-height:20px}
.t-c{font-size:12px;line-height:16px}
.mono{font-family:var(--mono);font-size:13px;line-height:18px}
.c2{color:var(--fg-2)}.c3{color:var(--fg-3)}.c4{color:var(--fg-4)}.ca{color:var(--accent-text)}.cok{color:var(--ok)}.cbad{color:var(--bad)}.cwarn{color:var(--warn)}
.w5{font-weight:500}.w6{font-weight:600}.w7{font-weight:700}
.pretty{text-wrap:pretty}
.ell{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* layout utilitário */
.col{display:flex;flex-direction:column}.row{display:flex;align-items:center}
.g2{gap:2px}.g4{gap:4px}.g6{gap:6px}.g8{gap:8px}.g10{gap:10px}.g12{gap:12px}.g14{gap:14px}.g16{gap:16px}.g20{gap:20px}.g24{gap:24px}
.grow{flex:1;min-width:0}.between{justify-content:space-between}.center{justify-content:center}.ai-c{align-items:center}.ai-s{align-items:flex-start}.ai-e{align-items:flex-end}.ai-b{align-items:baseline}.self-s{align-self:flex-start}.self-c{align-self:center}.wrap{flex-wrap:wrap}.ta-r{text-align:right}.ta-c{text-align:center}.none{flex:none}
.hide{display:none !important}

/* barras de topo */
.topbar{display:flex;align-items:center;gap:12px;min-height:44px}
.topbar .tb-t{flex:1;text-align:center;font-size:16px;font-weight:600;min-width:0}
.topbar .tb-t small{display:block;font-size:12.5px;font-weight:400;color:var(--fg-3)}
.cbtn{width:42px;height:42px;border-radius:999px;background:var(--card);display:inline-flex;align-items:center;justify-content:center;flex:none;color:var(--fg);position:relative}
.cbtn.sm{width:36px;height:36px;background:var(--bg)}
.cbtn.on-ink{background:rgba(255,255,255,.12);color:var(--inverse-fg)}
.cbtn .badge{position:absolute;top:9px;right:10px;width:8px;height:8px;border-radius:9px;background:var(--accent);box-shadow:0 0 0 2px var(--card)}
.hdr{display:flex;align-items:center;justify-content:space-between;gap:12px}
.hdr .eb{font-size:14px;color:var(--fg-3)}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
.sec-h .a{font-size:14px;font-weight:500;color:var(--accent-text);flex:none}
.lbl{font-size:12px;font-weight:600;color:var(--fg-3);letter-spacing:.5px;text-transform:uppercase}

/* superfícies */
.card{background:var(--card);border-radius:24px;padding:18px}
.card.p16{padding:16px}
.card.tight{padding:14px}
.card.tonal{background:var(--tonal)}
.card.inkc{background:var(--inverse);color:var(--inverse-fg)}
.grp{background:var(--card);border-radius:24px;padding:4px 16px}
.grp.p0{padding:4px 0}
.li{position:relative;display:flex;align-items:center;gap:12px;padding:12px 0;min-height:56px;width:100%;text-align:left}
.li.sm{min-height:48px;padding:10px 0}
.grp.p0 .li{padding-left:16px;padding-right:16px}
.li + .li::before,.li + .lx::before,.lx + .li::before{content:"";position:absolute;top:0;left:var(--inset,0);right:0;height:1px;background:var(--line)}
.grp.p0 .li + .li::before{left:calc(16px + var(--inset,0px));right:16px}
.li.hi{--inset:52px}
.li .tt{font-size:15px;line-height:20px;font-weight:500}
.li .mm{font-size:13px;line-height:18px;color:var(--fg-3)}
.li .end{display:flex;flex-direction:column;align-items:flex-end;gap:2px;flex:none}
.amt{font-size:15px;line-height:20px;font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}
.amt.in{color:var(--ok)}
.amt.fc{color:var(--fg-3);font-weight:500}
.mi{width:40px;height:40px;border-radius:13px;display:inline-flex;align-items:center;justify-content:center;flex:none;background:oklch(var(--soft-l) var(--soft-c) var(--h,260));color:oklch(var(--strong-l) var(--strong-c) var(--h,260))}
.mi.sm{width:32px;height:32px;border-radius:10px}
.mi.lg{width:56px;height:56px;border-radius:18px}
.mi.neutral{background:var(--bg);color:var(--fg-2)}
.mi.acc{background:var(--accent);color:var(--on-accent)}
.mi.ton{background:var(--tonal);color:var(--tonal-fg)}
.mi.dash{background:transparent;box-shadow:inset 0 0 0 1.5px var(--border);color:var(--fg-3)}
.m-notas{--h:80}.m-lembretes{--h:25}.m-financas{--h:160}.m-invest{--h:205}.m-biblia{--h:350}.m-dieta{--h:130}.m-anot{--h:305}.m-compras{--h:55}.m-galeria{--h:240}.m-agenda{--h:25}
.tag{display:inline-flex;align-items:center;gap:4px;height:24px;padding:0 9px;border-radius:999px;font-size:12px;font-weight:600;background:var(--bg);color:var(--fg-2);white-space:nowrap;flex:none}
.tag.ok{background:var(--ok-soft);color:var(--ok)}.tag.warn{background:var(--warn-soft);color:var(--warn)}.tag.bad{background:var(--bad-soft);color:var(--bad)}.tag.ton{background:var(--tonal);color:var(--tonal-fg)}.tag.out{background:transparent;box-shadow:inset 0 0 0 1px var(--border);color:var(--fg-3)}.tag.ink{background:var(--inverse);color:var(--inverse-fg)}
.tag.lg{height:28px;padding:0 10px;font-size:13px}
.ptime{height:26px;padding:0 10px;border-radius:999px;background:var(--bg);display:inline-flex;align-items:center;font-size:12.5px;font-weight:600;flex:none;font-variant-numeric:tabular-nums}

/* botões */
.btn{height:52px;border-radius:999px;padding:0 22px;display:inline-flex;align-items:center;justify-content:center;gap:8px;font-size:16px;font-weight:600;white-space:nowrap;flex:none}
.btn.p{background:var(--accent);color:var(--on-accent);box-shadow:var(--sh-fab)}
.btn.p:active{background:var(--accent-press)}
.btn.t{background:var(--tonal);color:var(--tonal-fg)}
.btn.g{background:var(--card);color:var(--fg)}
.btn.q{background:transparent;color:var(--accent-text);padding:0 12px}
.btn.d{background:var(--bad-soft);color:var(--bad)}
.btn.ink{background:var(--inverse);color:var(--inverse-fg)}
.btn.b{width:100%}
.btn.sm{height:36px;padding:0 14px;font-size:14px;box-shadow:none}
.btn.md{height:44px;padding:0 18px;font-size:15px}
.btn[disabled],.btn.off{background:var(--track);color:var(--fg-4);box-shadow:none;pointer-events:none}
.link{font-size:14px;font-weight:600;color:var(--accent-text)}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chips.scroll-x{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;margin:0 -20px;padding:0 20px}
.chips.scroll-x::-webkit-scrollbar{display:none}
.chip{height:36px;padding:0 14px;border-radius:999px;background:var(--card);display:inline-flex;align-items:center;gap:6px;font-size:14px;font-weight:500;flex:none;white-space:nowrap;color:var(--fg)}
.in-card .chip,.sheet .chip{background:var(--bg)}
.chip.on{background:var(--tonal);color:var(--tonal-fg);font-weight:600}
.chip .ck-mark{width:16px;display:inline-flex;opacity:0;transform:scale(.4);transition:opacity 120ms linear,transform calc(340ms*var(--slow)) var(--spring)}
.chip.on .ck-mark{opacity:1;transform:none}
.chip .mi{width:22px;height:22px;border-radius:7px}

/* controle segmentado */
.seg{display:flex;padding:4px;border-radius:14px;background:var(--track);position:relative;flex:none}
.seg .s-i{flex:1;height:34px;display:flex;align-items:center;justify-content:center;gap:6px;font-size:14px;font-weight:500;color:var(--fg-2);position:relative;z-index:1;border-radius:10px;white-space:nowrap;padding:0 8px}
.seg .s-i.on{color:var(--fg);font-weight:600}
.seg .s-ind{position:absolute;top:4px;bottom:4px;left:4px;border-radius:10px;background:var(--card);box-shadow:var(--sh-seg);transition:transform calc(340ms*var(--slow)) var(--std)}
:root[data-theme="dark"] .seg .s-ind{background:var(--card-2)}
.seg.pill{border-radius:999px;padding:3px}
.seg.pill .s-i{height:32px;border-radius:999px;font-size:13px}
.seg.pill .s-ind{border-radius:999px;top:3px;bottom:3px;left:3px}
.periods{display:flex;gap:6px}
.periods button{height:30px;padding:0 12px;border-radius:999px;background:var(--bg);font-size:13px;font-weight:500}
.periods button.on{background:var(--inverse);color:var(--inverse-fg);font-weight:600}

/* campos */
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field>label,.field>.fl{font-size:13px;font-weight:500;color:var(--fg-3)}
.inp{height:52px;border-radius:16px;background:var(--card);border:0;outline:0;padding:0 16px;font-size:16px;width:100%;color:var(--fg);display:flex;align-items:center;gap:10px;transition:box-shadow 160ms linear}
.sheet .inp,.in-card .inp{background:var(--bg)}
.inp::placeholder,.inp .ph{color:var(--fg-4)}
.inp:focus,.inp:focus-within,.inp.focus{box-shadow:0 0 0 2px var(--accent),0 0 0 8px var(--tonal)}
.inp.err{box-shadow:0 0 0 2px var(--bad-strong)}
.inp input{border:0;outline:0;background:transparent;flex:1;min-width:0;height:100%;font-size:16px;color:var(--fg)}
textarea.inp{height:auto;min-height:96px;padding:14px 16px;resize:none;line-height:24px}
.f2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.hint{font-size:13px;line-height:18px;color:var(--fg-3);display:flex;gap:6px;align-items:flex-start}
.hint.bad{color:var(--bad)}.hint.warn{color:var(--warn)}
.search{height:48px;border-radius:999px;background:var(--card);display:flex;align-items:center;gap:10px;padding:0 6px 0 16px;color:var(--fg-3)}
.search input{border:0;outline:0;background:transparent;flex:1;min-width:0;font-size:15px;color:var(--fg);height:100%}
.search .ai-b{width:36px;height:36px;border-radius:999px;background:var(--tonal);color:var(--accent-text);display:flex;align-items:center;justify-content:center;flex:none}

/* seleção */
.sw{width:50px;height:30px;border-radius:999px;background:var(--border);position:relative;flex:none;transition:background-color calc(160ms*var(--slow)) linear}
.sw::after{content:"";position:absolute;top:2px;left:2px;width:26px;height:26px;border-radius:999px;background:#fff;box-shadow:var(--sh-knob);transition:transform calc(300ms*var(--slow)) var(--spring)}
.sw.on{background:var(--accent)}
.sw.on::after{transform:translateX(20px)}
.ck{width:24px;height:24px;border-radius:999px;box-shadow:inset 0 0 0 1.5px var(--border);display:inline-flex;align-items:center;justify-content:center;flex:none;color:var(--on-accent);transition:background-color calc(160ms*var(--slow)) linear,box-shadow calc(160ms*var(--slow)) linear}
.ck.sq{border-radius:7px}
.ck svg{transform:scale(.3);opacity:0;transition:transform calc(340ms*var(--slow)) var(--spring),opacity 120ms linear}
.ck.on{background:var(--accent);box-shadow:inset 0 0 0 1.5px var(--accent)}
.ck.on svg{transform:none;opacity:1}
.radio{width:22px;height:22px;border-radius:99px;box-shadow:inset 0 0 0 1.5px var(--border);flex:none;position:relative;transition:box-shadow 160ms linear}
.radio::after{content:"";position:absolute;inset:6px;border-radius:99px;background:var(--accent);transform:scale(0);transition:transform calc(300ms*var(--slow)) var(--spring)}
.on>.radio,.radio.on{box-shadow:inset 0 0 0 1.5px var(--accent)}
.on>.radio::after,.radio.on::after{transform:none}
.st{position:relative;display:inline-block;transition:color calc(200ms*var(--slow)) linear}
.st::after{content:"";position:absolute;left:0;right:0;top:55%;height:1.5px;background:currentColor;transform:scaleX(0);transform-origin:left;transition:transform calc(260ms*var(--slow)) var(--std) calc(80ms*var(--slow))}
.done .st{color:var(--fg-3)}
.done .st::after{transform:scaleX(1)}

/* barras e gráficos */
.bar{height:8px;border-radius:999px;background:var(--track);overflow:hidden;position:relative;display:flex}
.bar.thin{height:4px}.bar.thick{height:10px}.bar.xl{height:12px;gap:3px;background:transparent}
.bar>i{display:block;height:100%;border-radius:999px;background:var(--fg-2);transform-origin:left;animation:grow calc(800ms*var(--slow)) var(--std) backwards}
.bar>i.acc{background:var(--accent)}
.bar>i.bad{background:var(--bad-strong)}
.bar>i.ok{background:var(--ok)}
.bar>i.fc{background:repeating-linear-gradient(135deg,var(--border) 0 3px,transparent 3px 6px);border-radius:0 999px 999px 0;animation-delay:calc(200ms*var(--slow))}
.bar>i + i{border-top-left-radius:0;border-bottom-left-radius:0}
.chart{display:flex;align-items:flex-end;gap:6px;height:120px;position:relative}
.chart .cb{flex:1;display:flex;flex-direction:column;justify-content:flex-end;gap:2px;height:100%;position:relative;transition:opacity 200ms linear}
.chart .cb i{display:block;border-radius:5px;background:var(--border);transform-origin:bottom;animation:growY calc(800ms*var(--slow)) var(--std) backwards}
.chart .cb i.acc{background:var(--accent)}
.chart .cb i.fc{background:repeating-linear-gradient(135deg,var(--border) 0 3px,transparent 3px 6px);box-shadow:inset 0 0 0 1px var(--border)}
.chart .cb i.out{background:transparent;box-shadow:inset 0 0 0 1.5px var(--fg-3)}
.chart.focus .cb{opacity:.35}
.chart.focus .cb.sel{opacity:1}
.chart-x{display:flex;justify-content:space-between;font-size:12px;color:var(--fg-3);gap:6px}
.chart-x span{flex:1;text-align:center}
.tip{position:absolute;bottom:calc(100% + 6px);left:50%;transform:translateX(-50%);font-size:12px;font-weight:600;white-space:nowrap;background:var(--inverse);color:var(--inverse-fg);border-radius:8px;padding:4px 8px;pointer-events:none;animation:pop calc(240ms*var(--slow)) var(--spring) backwards;z-index:3}
.ring{position:relative;display:inline-flex;align-items:center;justify-content:center;flex:none}
.ring svg{transform:rotate(-90deg)}
.ring circle{fill:none}
.ring .trk{stroke:var(--track)}
.ring .val{stroke:var(--accent);stroke-linecap:round;transition:stroke-dashoffset calc(800ms*var(--slow)) var(--std)}
.ring .lbl-in{position:absolute;display:flex;flex-direction:column;align-items:center;text-align:center}
.dist{height:12px;border-radius:999px;overflow:hidden;display:flex;gap:3px}
.dist span{display:block;height:100%;transform-origin:left;animation:grow calc(800ms*var(--slow)) var(--std) backwards}
.dotc{width:8px;height:8px;border-radius:99px;flex:none;display:inline-block}

/* IA */
.aib{background:var(--tonal);border-radius:20px;padding:14px 16px;display:flex;align-items:flex-start;gap:12px}
.aib .tx{font-size:14px;line-height:20px;text-wrap:pretty;color:var(--fg)}
.aib .ac{font-size:13px;font-weight:600;color:var(--tonal-fg)}
.askbar{height:56px;border-radius:999px;background:var(--card);display:flex;align-items:center;gap:12px;padding:0 8px 0 14px;width:100%}
.askbar .ph{flex:1;font-size:15px;color:var(--fg-3);text-align:left}
.askbar .mic{width:40px;height:40px;border-radius:999px;background:var(--bg);display:flex;align-items:center;justify-content:center;color:var(--fg)}
.bub{max-width:280px;border-radius:20px 20px 20px 6px;padding:12px 14px;font-size:15px;line-height:22px;background:var(--card);align-self:flex-start;text-wrap:pretty;animation:pop calc(380ms*var(--slow)) var(--spring) backwards}
.bub.me{background:var(--accent);color:var(--on-accent);border-radius:20px 20px 6px 20px;align-self:flex-end;max-width:260px}
.bub.wide{width:290px;max-width:290px;display:flex;flex-direction:column;gap:12px}
.typing{display:flex;gap:5px;align-items:center;height:20px}
.typing span{width:7px;height:7px;border-radius:99px;background:var(--fg-3);animation:gdot calc(1.1s*var(--slow)) ease-in-out infinite}
.typing span:nth-child(2){animation-delay:.15s}.typing span:nth-child(3){animation-delay:.3s}
.composer{position:absolute;left:0;right:0;bottom:0;padding:28px 16px 30px;background:linear-gradient(180deg,color-mix(in srgb,var(--bg) 0%,transparent) 0%,var(--bg) 26%);display:flex;flex-direction:column;gap:10px;z-index:10}
.comp{height:56px;border-radius:999px;background:var(--card);display:flex;align-items:center;gap:8px;padding:0 6px;box-shadow:var(--sh-2)}
.comp input{flex:1;border:0;outline:0;background:transparent;font-size:15px;min-width:0;color:var(--fg)}
.comp .r{width:44px;height:44px;border-radius:999px;display:flex;align-items:center;justify-content:center;background:var(--bg);flex:none}
.comp .r.send{background:var(--accent);color:var(--on-accent)}

/* barra de abas */
.tabbar{position:absolute;left:14px;right:14px;bottom:20px;height:68px;border-radius:26px;background:var(--card);box-shadow:var(--sh-nav);display:grid;grid-template-columns:repeat(5,minmax(0,1fr));align-items:center;padding:0 4px;z-index:40;transition:transform calc(320ms*var(--slow)) var(--std),opacity calc(200ms*var(--slow)) linear}
.tabbar.away{transform:translateY(130%);opacity:0;pointer-events:none}
.tb-i{display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--fg-3);font-size:11px;font-weight:500;height:100%;justify-content:center;position:relative;z-index:1}
.tb-i .ic{height:30px;width:52px;display:flex;align-items:center;justify-content:center}
.tb-i.on{color:var(--tonal-fg);font-weight:600}
.tb-ind{position:absolute;top:10px;left:0;width:52px;height:30px;border-radius:999px;background:var(--tonal);transition:transform calc(340ms*var(--slow)) var(--std),opacity 200ms linear;z-index:0}
.tb-c{display:flex;justify-content:center}
.fab{width:52px;height:52px;border-radius:18px;background:var(--accent);color:var(--on-accent);display:flex;align-items:center;justify-content:center;box-shadow:var(--sh-fab)}
.fab svg{transition:transform calc(320ms*var(--slow)) var(--spring)}
.fab.open{background:var(--inverse);box-shadow:var(--sh-2)}
.fab.open svg{transform:rotate(45deg)}

/* folha, aviso, diálogo */
.layer{position:absolute;inset:0;z-index:60}
.scrim{position:absolute;inset:0;background:var(--scrim)}
.sheet{position:absolute;left:0;right:0;bottom:0;max-height:92%;background:var(--card);border-radius:28px 28px 0 0;display:flex;flex-direction:column;box-shadow:var(--sh-3)}
.sheet.full{height:92%}
.grab{width:38px;height:5px;border-radius:9px;background:var(--border);margin:8px auto 0;flex:none}
.sh-h{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 20px 4px;flex:none}
.sh-b{padding:14px 20px 20px;overflow-y:auto;display:flex;flex-direction:column;gap:18px;scrollbar-width:none;flex:1}
.sh-b::-webkit-scrollbar{display:none}
.sh-f{padding:12px 20px 30px;display:flex;gap:10px;flex:none;border-top:1px solid var(--line)}
.sh-f .btn{flex:1}
.dialog{position:absolute;left:24px;right:24px;top:50%;transform:translateY(-50%);background:var(--card);border-radius:26px;padding:22px;display:flex;flex-direction:column;gap:14px;box-shadow:var(--sh-3)}
.toasts{position:absolute;left:16px;right:16px;bottom:104px;z-index:65;pointer-events:none;transition:bottom 300ms var(--std)}
.toasts.low{bottom:28px}
.toast{pointer-events:auto;background:var(--inverse);color:var(--inverse-fg);border-radius:18px;padding:14px 16px;display:flex;align-items:center;gap:12px;font-size:14.5px;line-height:20px;box-shadow:var(--sh-2)}
.toast .ta{font-weight:600;color:var(--inverse-2);font-size:14px;flex:none}
.xp{position:absolute;z-index:45;background:var(--card);overflow:hidden;pointer-events:none}
.alert{border-radius:18px;padding:12px 14px;display:flex;gap:10px;align-items:flex-start;font-size:14px;line-height:20px}
.alert.warn{background:var(--warn-soft);color:var(--warn)}.alert.bad{background:var(--bad-soft);color:var(--bad)}.alert.ok{background:var(--ok-soft);color:var(--ok)}.alert.info{background:var(--tonal);color:var(--tonal-fg)}.alert.neutral{background:var(--card);color:var(--fg-2)}
.alert b{font-weight:600}
.empty{display:flex;flex-direction:column;align-items:center;text-align:center;gap:10px;padding:28px 12px}
.empty .t-3{margin-top:6px}
.empty p{margin:0;font-size:15px;line-height:22px;color:var(--fg-3);max-width:280px;text-wrap:pretty}
.mini-empty{font-size:14px;color:var(--fg-3);padding:4px 0 2px;display:flex;align-items:center;gap:8px}

/* módulos: blocos de atalho */
.tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px 10px}
.tile{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:12px;font-weight:500}
.tile .mi{width:100%;height:60px;border-radius:20px}

/* específicos */
.daystrip{display:flex;gap:6px;margin:0 -20px;padding:0 20px;overflow-x:auto;scrollbar-width:none}
.daystrip::-webkit-scrollbar{display:none}
.day{flex:1;min-width:44px;height:64px;border-radius:16px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:12px;color:var(--fg-3);background:transparent;position:relative}
.day b{font-size:17px;font-weight:600;color:var(--fg)}
.day.on{background:var(--card);box-shadow:var(--sh-1);color:var(--fg)}
.day.today b{color:var(--accent-text)}
.day .dt{position:absolute;bottom:7px;width:4px;height:4px;border-radius:9px;background:var(--fg-4)}
.timeline{display:flex;flex-direction:column}
.tl{display:grid;grid-template-columns:48px minmax(0,1fr);gap:12px;align-items:stretch}
.tl .h{font-size:12.5px;font-weight:600;color:var(--fg-3);padding-top:14px;font-variant-numeric:tabular-nums}
.ev{border-radius:18px;padding:12px 14px;margin:4px 0;display:flex;flex-direction:column;gap:2px;background:var(--card);text-align:left;width:100%}
.ev.mod{background:oklch(var(--soft-l) var(--soft-c) var(--h))}
.ev.mod .tt{color:var(--fg)}
.now{position:relative;height:2px;background:var(--bad-strong);margin:6px 0 6px 60px;border-radius:2px}
.now::before{content:"";position:absolute;left:-5px;top:-4px;width:10px;height:10px;border-radius:9px;background:var(--bad-strong)}
.verse{font-family:var(--serif);font-size:19px;line-height:32px;color:var(--fg)}
.verse.sans{font-family:var(--font);font-size:18px;line-height:30px}
.vn{font-family:var(--font);font-size:11px;font-weight:600;color:var(--fg-4);vertical-align:super;margin-right:5px;font-variant-numeric:tabular-nums}
.vs{border-radius:4px;transition:background-color 200ms linear,box-shadow 200ms linear;cursor:pointer;-webkit-box-decoration-break:clone;box-decoration-break:clone}
.vs.sel{background:var(--tonal);box-shadow:0 0 0 2px var(--tonal)}
.vs.hy{background:oklch(var(--hlt-l) var(--hlt-c) 95)}.vs.hg{background:oklch(var(--hlt-l) var(--hlt-c) 150)}.vs.hb{background:oklch(var(--hlt-l) var(--hlt-c) 250)}.vs.hp{background:oklch(var(--hlt-l) var(--hlt-c) 350)}
.vs.ul{text-decoration:underline;text-decoration-color:var(--accent-text);text-underline-offset:5px;text-decoration-thickness:2px}
.vs.ed{box-shadow:inset 0 -2px 0 var(--fg-4)}
.hdot{width:28px;height:28px;border-radius:99px;flex:none;box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--fg) 10%,transparent)}
.hdot.y{background:oklch(var(--hlt-l) var(--hlt-c) 95)}.hdot.g{background:oklch(var(--hlt-l) var(--hlt-c) 150)}.hdot.b{background:oklch(var(--hlt-l) var(--hlt-c) 250)}.hdot.p{background:oklch(var(--hlt-l) var(--hlt-c) 350)}
.selbar{position:absolute;left:16px;right:16px;bottom:24px;z-index:30;background:var(--inverse);color:var(--inverse-fg);border-radius:22px;padding:10px;display:flex;flex-direction:column;gap:8px;box-shadow:var(--sh-2)}
.selbar .r{display:flex;align-items:center;gap:6px;justify-content:space-between}
.selbar .sb{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;font-weight:500;padding:6px 4px;border-radius:12px;flex:1;color:var(--inverse-fg)}
.read-bar{position:absolute;left:16px;right:16px;bottom:20px;height:64px;border-radius:24px;background:var(--card);box-shadow:var(--sh-nav);display:flex;align-items:center;gap:8px;padding:0 10px;z-index:20;transition:transform calc(320ms*var(--slow)) var(--std)}
.read-bar.away{transform:translateY(140%)}
.md h3{font-size:20px;line-height:26px;font-weight:600;letter-spacing:-.4px;margin:6px 0 0}
.md p{margin:0;font-size:16px;line-height:26px;color:var(--fg-2)}
.md ul{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:4px;color:var(--fg-2);line-height:24px}
.md blockquote{margin:0;padding:2px 0 2px 14px;box-shadow:inset 2px 0 0 var(--border);color:var(--fg-2);font-style:italic}
.md .wl{color:var(--accent-text);font-weight:500;background:var(--hl);border-radius:6px;padding:0 4px}
.md .serif{font-family:var(--serif);font-size:17px;line-height:29px}
.li.kb-on .tt{color:var(--accent-text)}
[contenteditable][data-ph]:empty::before{content:attr(data-ph);color:var(--fg-4)}
.li.on .radio{box-shadow:inset 0 0 0 1.5px var(--accent)}
.li.on .radio::after{transform:none}
.card.on .radio{box-shadow:inset 0 0 0 1.5px var(--accent)}
.card.on .radio::after{transform:none}
.code-box{display:flex;gap:8px;justify-content:center}
.code-box .cx{width:46px;height:58px;border-radius:14px;background:var(--card);display:flex;align-items:center;justify-content:center;font-size:24px;font-weight:600;font-variant-numeric:tabular-nums;transition:box-shadow 160ms linear}
.code-box .cx.cur{box-shadow:0 0 0 2px var(--accent),0 0 0 8px var(--tonal)}
.code-box .cx.err{box-shadow:0 0 0 2px var(--bad-strong);color:var(--bad)}
.code-box .gap{width:10px}
.qr{width:168px;height:168px;border-radius:18px;background:#FFFFFF;padding:12px;display:grid;grid-template-columns:repeat(21,1fr);gap:0}
.qr i{display:block;aspect-ratio:1}
.photo{border-radius:16px;overflow:hidden;position:relative;aspect-ratio:1;background:oklch(var(--soft-l) var(--soft-c) var(--h,240));display:block;width:100%}
.photo svg{width:100%;height:100%;display:block}
.photo .ov{position:absolute;left:8px;bottom:8px;right:8px;display:flex;gap:4px}
.pgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:4px}
.pgrid .photo{border-radius:6px}
.big-amt{font-size:48px;line-height:52px;font-weight:700;letter-spacing:-2px;font-variant-numeric:tabular-nums;text-align:center;border:0;outline:0;background:transparent;width:100%;color:var(--fg);caret-color:var(--accent)}
.big-amt.neg{color:var(--fg)}.big-amt.pos{color:var(--ok)}
.calhm{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px}
.calhm i{aspect-ratio:1;border-radius:6px;background:var(--track);display:block}
.calhm i.d1{background:var(--c200)}.calhm i.d2{background:var(--accent)}.calhm i.t{box-shadow:0 0 0 2px var(--fg)}
.wave{display:flex;align-items:center;gap:3px;height:28px}
.wave i{display:block;width:3px;border-radius:3px;background:currentColor;animation:wv 1s var(--loop) infinite alternate}
.lock{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;padding:calc(var(--sb) + 60px) 28px 40px;gap:14px;background:var(--bg)}
.bio{width:92px;height:92px;border-radius:30px;background:var(--tonal);color:var(--tonal-fg);display:flex;align-items:center;justify-content:center;position:relative}
.bio::before{content:"";position:absolute;inset:-10px;border-radius:38px;box-shadow:0 0 0 2px var(--c200);animation:pulse 1.6s var(--loop) infinite}
.shake{animation:shake calc(380ms*var(--slow)) var(--std)}
.ph-line{height:10px;border-radius:6px;background:var(--track)}
.kbd{font-family:var(--mono);font-size:11.5px;padding:2px 6px;border-radius:6px;background:var(--bg);color:var(--fg-3);box-shadow:inset 0 -1px 0 var(--border)}
.pop{position:absolute;z-index:25;background:var(--card);border-radius:18px;box-shadow:var(--sh-2);padding:6px;display:flex;flex-direction:column;min-width:220px;animation:pop calc(300ms*var(--slow)) var(--spring) backwards}
.pop .pi{display:flex;align-items:center;gap:10px;padding:10px;border-radius:12px;font-size:14.5px;text-align:left}
.pop .pi.on{background:var(--hl)}
.fmt-bar{position:absolute;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);padding:8px 12px 28px;display:flex;gap:4px;z-index:12}
.fmt-bar button{height:40px;min-width:40px;border-radius:12px;display:flex;align-items:center;justify-content:center;color:var(--fg-2);padding:0 8px;font-size:14px;font-weight:600}
.savest{font-size:12.5px;color:var(--fg-3);display:inline-flex;align-items:center;gap:5px}
.savest i.d{width:6px;height:6px;border-radius:9px;background:var(--ok)}
.savest.ing i.d{background:var(--fg-4);animation:blinkd 1s linear infinite}
.cta-bar{position:absolute;left:0;right:0;bottom:0;padding:24px 20px 30px;background:linear-gradient(180deg,color-mix(in srgb,var(--bg) 0%,transparent) 0%,var(--bg) 32%);z-index:10;display:flex;gap:10px}
.cta-bar .btn{flex:1}
.inst{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--fg-3)}
.kv{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.kv>div{display:flex;flex-direction:column;gap:2px;min-width:0}
.kv .k{font-size:12.5px;color:var(--fg-3)}
.kv .v{font-size:15px;font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}
.inkc .kv .k{color:var(--inverse-3)}
.monthsel{display:flex;align-items:center;gap:4px;background:var(--card);border-radius:999px;padding:3px;align-self:flex-start}
.monthsel button{width:34px;height:34px;border-radius:999px;display:flex;align-items:center;justify-content:center;color:var(--fg-2)}
.monthsel span{min-width:96px;text-align:center;font-size:14px;font-weight:600}
.mascot .eyes{animation:blink calc(4s*var(--slow)) infinite;transform-box:fill-box;transform-origin:center}
.float{animation:float calc(1.4s*var(--slow)) var(--loop) infinite alternate}
.spin{animation:spin 1s linear infinite}
.slide-l{animation:slL calc(320ms*var(--slow)) var(--enter) backwards}
.slide-r{animation:slR calc(320ms*var(--slow)) var(--enter) backwards}
.rv{animation:rise calc(420ms*var(--slow)) var(--enter) backwards}
.pv{animation:pop calc(380ms*var(--slow)) var(--spring) backwards}
.fd{animation:fade calc(240ms*var(--slow)) var(--std) backwards}
/* telas complementares */
.app mark{background:var(--tonal);color:var(--tonal-fg);border-radius:4px;padding:0 2px}
.udot{width:8px;height:8px;border-radius:9px;background:var(--accent);flex:none;display:inline-block}
.li.unread .tt{font-weight:600}
.anot{background:var(--card);color:var(--fg);border-radius:22px;padding:14px 16px;display:flex;flex-direction:column;gap:8px;text-align:left}
.mgrid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:2px}
.mgrid .mh{font-size:12px;color:var(--fg-3);text-align:center;padding:4px 0 6px;font-weight:600}
.md-d{aspect-ratio:1;border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:15px;font-weight:500;transition:background-color 200ms linear,box-shadow 200ms linear}
.md-d.out{color:var(--fg-4)}
.md-d.today{box-shadow:inset 0 0 0 1.5px var(--accent-text)}
.md-d.sel{background:var(--tonal);color:var(--tonal-fg);font-weight:600}
.md-d .dots{display:flex;gap:2px;height:4px}
.md-d .dots i{width:4px;height:4px;border-radius:9px;display:block}
/* ============ Modo web: janela de navegador, navegação no topo, coluna de 720 px ============ */
.browser-bar,.topnav{display:none}
.phone.web{width:1180px;height:800px;border-radius:16px;padding:0;background:var(--card-2);overflow:hidden;display:flex;flex-direction:column}
.phone.web .island{display:none}
.phone.web .browser-bar{display:flex;align-items:center;gap:14px;height:40px;padding:0 14px;flex:none;border-bottom:1px solid var(--line)}
.bdots{display:flex;gap:6px}.bdots i{width:11px;height:11px;border-radius:9px;background:var(--border);display:block}
.browser-bar .url{flex:0 1 460px;margin:0 auto;height:26px;border-radius:8px;background:var(--bg);display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-size:12.5px;color:var(--fg-3)}
.phone.web .app{border-radius:0;height:calc(100% - 40px)}
.app.web{--sb:72px}
.app.web .statusbar,.app.web .tabbar{display:none}
.app.web .topnav{display:flex;position:absolute;inset:0 0 auto;height:64px;z-index:50;background:var(--bg);border-bottom:1px solid var(--line);align-items:center;gap:16px;padding:0 24px}
.tn-l{display:flex;gap:4px;flex:1;justify-content:center}
.tn-a{height:36px;padding:0 14px;border-radius:999px;font-size:14px;font-weight:500;color:var(--fg-2)}
.tn-a:hover{background:var(--card)}
.tn-a.on{background:var(--card);color:var(--fg);font-weight:600;box-shadow:var(--sh-seg)}
.tn-s{height:40px;width:230px;border-radius:999px;background:var(--card);display:flex;align-items:center;gap:8px;padding:0 8px 0 14px;font-size:14px;color:var(--fg-3)}
.app.web .pad{max-width:720px;margin:0 auto;padding-left:24px;padding-right:24px}
.app.web .cta-bar,.app.web .composer{left:calc(50% - 360px);right:calc(50% - 360px)}
.app.web .fmt-bar{left:calc(50% - 360px);right:calc(50% - 360px);border-radius:16px 16px 0 0;padding-bottom:12px}
.app.web .read-bar,.app.web .selbar{left:calc(50% - 344px);right:calc(50% - 344px)}
.app.web .xfab{right:calc(50% - 340px) !important}
.app.web .toasts{left:24px;right:auto;width:400px;bottom:24px}
.app.web .layer .sheet{left:calc(50% - 280px);right:calc(50% - 280px);bottom:auto;top:7%;max-height:86%;border-radius:28px}
.app.web .layer .sheet.full{height:86%}
.app.web .grab{display:none}
.app.web .sh-f{padding-bottom:20px}
.app.web .lock{padding-left:calc(50% - 210px);padding-right:calc(50% - 210px)}
.app.web .pad .chips.scroll-x,.app.web .pad .daystrip{margin:0 -24px;padding:0 24px}
.app.web .tiles{grid-template-columns:repeat(8,minmax(0,1fr))}
/* a primeira tela abre pronta, sem entrada (fica completa mesmo se a página carregar em segundo plano) */
.scr.still :is(.rv,.pv,.fd,.slide-l,.slide-r,.bar>i,.chart .cb i,.dist span,.bub){animation:none !important}
@keyframes rise{from{opacity:0;transform:translateY(18px)}}
@keyframes pop{from{opacity:0;transform:translateY(14px) scale(.92)}}
@keyframes fade{from{opacity:0}}
@keyframes grow{from{transform:scaleX(0)}}
@keyframes growY{from{transform:scaleY(0)}}
@keyframes blink{0%,95%,100%{transform:scaleY(1)}97.5%{transform:scaleY(.1)}}
@keyframes float{from{transform:translateY(0)}to{transform:translateY(-8px)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-8px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(2px)}}
@keyframes pulse{0%{transform:scale(.92);opacity:.9}100%{transform:scale(1.18);opacity:0}}
@keyframes gdot{0%,60%,100%{transform:translateY(0);opacity:.35}30%{transform:translateY(-4px);opacity:1}}
@keyframes slL{from{opacity:0;transform:translateX(-28px)}}
@keyframes slR{from{opacity:0;transform:translateX(28px)}}
@keyframes wv{from{height:6px}to{height:26px}}
@keyframes blinkd{50%{opacity:.2}}
html.rm *,html.rm *::before,html.rm *::after{animation-duration:160ms !important;animation-iteration-count:1 !important;transition-duration:160ms !important}
html.rm .rv,html.rm .pv,html.rm .slide-l,html.rm .slide-r{animation-name:fade !important}
html.rm .bar>i,html.rm .chart .cb i,html.rm .dist span{animation-name:fade !important}
html.rm .bio::before,html.rm .float,html.rm .mascot .eyes{animation:none !important}
</style>
