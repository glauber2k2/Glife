<title>Glife Investimentos v2</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=DM+Mono:wght@400;500&display=swap">
<style>
/* Layout: ficha da opção à esquerda · celular 390×844 no centro. Tokens = Glife Cobalto v1.0 (claro/escuro) + paleta de gráficos validada (daltonismo, claro e escuro). */
:root{
  --canvas:#DCE1EA; --bg:#F1F3F6; --card:#FFFFFF; --card-2:#F7F8FA;
  --fg:#0E1116; --fg-2:#4B5260; --fg-3:#636A77; --fg-4:#9AA0AB;
  --line:#ECEEF2; --border:#C9CED8; --track:#E6E9EE;
  --accent:#2D5BFF; --accent-press:#2349DB; --accent-text:#2D5BFF; --on-accent:#FFFFFF;
  --tonal:#E2E8FF; --tonal-fg:#1F3FB8; --hl:#F3F5FF;
  --inverse:#0E1116; --inverse-fg:#FFFFFF; --inverse-2:#9DB2FF; --inverse-3:#9AA0AB;
  --ok:#15803D; --ok-soft:#DCF2E4; --warn:#7A5000; --warn-soft:#FCEFD6; --bad:#A3322A; --bad-soft:#FBE3E1;
  --scrim:rgba(14,17,22,.36);
  --sh-seg:0 1px 3px rgba(14,17,22,.12);
  --sh-2:0 14px 32px -12px rgba(14,17,22,.32);
  --sh-3:0 -12px 40px -14px rgba(14,17,22,.34),0 18px 40px -16px rgba(14,17,22,.3);
  --sh-nav:0 12px 32px -12px rgba(14,17,22,.3),0 0 0 1px rgba(14,17,22,.04);
  --sh-fab:0 10px 22px -8px rgba(45,91,255,.7);
  --frame:#0A0A0A;
  /* gráficos: renda fixa · cripto · ações · FIIs · previdência (ordem fixa) */
  --c-rf:#2D5BFF; --c-cripto:#E29936; --c-acao:#009A9B; --c-fii:#70449C; --c-prev:#348F4F;
  --font:'Outfit',system-ui,-apple-system,'Segoe UI',sans-serif;
  --mono:'DM Mono',ui-monospace,'Cascadia Mono',monospace;
  --std:cubic-bezier(.2,0,0,1); --enter:cubic-bezier(.05,.7,.1,1); --exit:cubic-bezier(.3,0,.8,.15); --spring:cubic-bezier(.34,1.56,.64,1);
  --sb:50px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --canvas:#05070B; --bg:#0C0F15; --card:#161B24; --card-2:#1D2330;
  --fg:#EEF1F6; --fg-2:#C3C9D4; --fg-3:#98A1B0; --fg-4:#646D7D;
  --line:#232A37; --border:#3A4252; --track:#262D3A;
  --accent:#3F68FF; --accent-press:#2F57EE; --accent-text:#8FA7FF; --on-accent:#FFFFFF;
  --tonal:#1B2650; --tonal-fg:#B7C5FF; --hl:#131A31;
  --inverse:#131F57; --inverse-fg:#FFFFFF; --inverse-2:#9DB2FF; --inverse-3:#AEB8DA;
  --ok:#62D394; --ok-soft:#10301F; --warn:#F1C46B; --warn-soft:#33270F; --bad:#FF948A; --bad-soft:#3B1917;
  --scrim:rgba(0,0,0,.58);
  --sh-seg:0 1px 3px rgba(0,0,0,.5);
  --sh-2:0 14px 32px -12px rgba(0,0,0,.7);
  --sh-3:0 -12px 40px -14px rgba(0,0,0,.7),0 18px 40px -16px rgba(0,0,0,.6);
  --sh-nav:0 12px 32px -12px rgba(0,0,0,.8),0 0 0 1px rgba(255,255,255,.06);
  --sh-fab:0 10px 22px -8px rgba(63,104,255,.6);
  --frame:#1A1D24;
  --c-rf:#5A7DFF; --c-cripto:#C8800D; --c-acao:#008E96; --c-fii:#7D4DAD; --c-prev:#40A35C;
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --canvas:#05070B; --bg:#0C0F15; --card:#161B24; --card-2:#1D2330;
  --fg:#EEF1F6; --fg-2:#C3C9D4; --fg-3:#98A1B0; --fg-4:#646D7D;
  --line:#232A37; --border:#3A4252; --track:#262D3A;
  --accent:#3F68FF; --accent-press:#2F57EE; --accent-text:#8FA7FF; --on-accent:#FFFFFF;
  --tonal:#1B2650; --tonal-fg:#B7C5FF; --hl:#131A31;
  --inverse:#131F57; --inverse-fg:#FFFFFF; --inverse-2:#9DB2FF; --inverse-3:#AEB8DA;
  --ok:#62D394; --ok-soft:#10301F; --warn:#F1C46B; --warn-soft:#33270F; --bad:#FF948A; --bad-soft:#3B1917;
  --scrim:rgba(0,0,0,.58);
  --sh-seg:0 1px 3px rgba(0,0,0,.5);
  --sh-2:0 14px 32px -12px rgba(0,0,0,.7);
  --sh-3:0 -12px 40px -14px rgba(0,0,0,.7),0 18px 40px -16px rgba(0,0,0,.6);
  --sh-nav:0 12px 32px -12px rgba(0,0,0,.8),0 0 0 1px rgba(255,255,255,.06);
  --sh-fab:0 10px 22px -8px rgba(63,104,255,.6);
  --frame:#1A1D24;
  --c-rf:#5A7DFF; --c-cripto:#C8800D; --c-acao:#008E96; --c-fii:#7D4DAD; --c-prev:#40A35C;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{min-height:100%}
body{background:var(--canvas);color:var(--fg);font-family:var(--font);-webkit-font-smoothing:antialiased;font-size:16px;line-height:1.4;margin:0}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:inherit}
input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent-text);outline-offset:2px}
svg.lucide{width:20px;height:20px;stroke-width:1.5;flex:none}
.s14 svg.lucide,svg.lucide.s14{width:14px;height:14px}.s16 svg.lucide,svg.lucide.s16{width:16px;height:16px}.s18 svg.lucide,svg.lucide.s18{width:18px;height:18px}
.tn{font-variant-numeric:tabular-nums}

/* ============ Página ============ */
.page{display:grid;grid-template-columns:minmax(0,360px) auto;justify-content:center;gap:40px;padding-block:28px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));align-items:start}
.side{display:flex;flex-direction:column;gap:18px;position:sticky;top:28px;min-width:0}
.brand{display:flex;align-items:center;gap:10px}
.brand b{font-size:22px;font-weight:600;letter-spacing:-.8px}
.brand small{display:block;font-family:var(--mono);font-size:11.5px;color:var(--fg-3)}
.logo{width:36px;height:36px;border-radius:12px;background:var(--accent);color:var(--on-accent);display:inline-flex;align-items:center;justify-content:center}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:18px;background:color-mix(in srgb,var(--card) 55%,transparent);transition:background-color 200ms linear,box-shadow 200ms linear}
.opt:hover{background:var(--card)}
.opt.on{background:var(--card);box-shadow:var(--sh-seg),inset 0 0 0 2px var(--accent)}
.opt .k{width:34px;height:34px;border-radius:11px;background:var(--bg);display:inline-flex;align-items:center;justify-content:center;font-family:var(--mono);font-size:14px;font-weight:500;flex:none}
.opt.on .k{background:var(--accent);color:var(--on-accent)}
.opt b{display:block;font-size:15px;font-weight:600}
.opt small{display:block;font-size:13px;color:var(--fg-3);line-height:17px}
.themes{display:flex;padding:3px;border-radius:12px;background:var(--track)}
.themes button{flex:1;text-align:center;height:30px;border-radius:9px;font-size:13px;font-weight:500;color:var(--fg-2)}
.themes button.on{background:var(--card);color:var(--fg);font-weight:600;box-shadow:var(--sh-seg)}
.ficha{background:var(--card);border-radius:24px;padding:20px;display:flex;flex-direction:column;gap:12px}
.ficha .eb{font-family:var(--mono);font-size:12px;color:var(--accent-text)}
.ficha h2{font-size:22px;line-height:27px;font-weight:600;letter-spacing:-.5px;margin:0;text-wrap:balance}
.ficha p{font-size:14px;line-height:21px;color:var(--fg-2);margin:0;text-wrap:pretty}
.ficha h3{font-size:12px;font-weight:600;color:var(--fg-3);letter-spacing:.5px;text-transform:uppercase;margin:6px 0 -4px}
.ficha ul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:6px;font-size:13.5px;line-height:19px;color:var(--fg-2)}
.ficha ul li::marker{color:var(--fg-4)}
.disc{font-size:12.5px;line-height:18px;color:var(--fg-3)}
.stage{display:flex;flex-direction:column;align-items:center;gap:12px;min-width:0}
.phone-wrap{position:relative;width:410px;height:864px}
.phone{width:410px;height:864px;border-radius:60px;background:var(--frame);padding:10px;box-shadow:0 40px 80px -40px rgba(14,17,22,.5);position:absolute;left:0;top:0;transform-origin:top left}
.island{position:absolute;top:21px;left:50%;margin-left:-55px;width:110px;height:32px;border-radius:20px;background:#000;z-index:90;pointer-events:none}
@media (max-width:860px){
  .page{grid-template-columns:minmax(0,1fr);gap:20px;padding-block:16px 32px}
  .side{position:static}
  .stage{order:-1}
}
@media (max-width:520px){
  .page{padding-left:0;padding-right:0}
  .side{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  .phone-wrap{width:100% !important;height:min(820px,calc(100dvh - 24px)) !important}
  .phone{position:relative;width:100%;height:100%;border-radius:0;padding:0;box-shadow:none;transform:none !important;background:var(--bg)}
  .phone .app{border-radius:0}
  .island{display:none}
}

/* ============ App ============ */
.app{position:relative;width:100%;height:100%;border-radius:50px;overflow:hidden;background:var(--bg);color:var(--fg);isolation:isolate;font-size:16px;line-height:1.35}
.statusbar{position:absolute;inset:0 0 auto;height:50px;display:flex;align-items:center;justify-content:space-between;padding:0 32px 0 38px;font-size:15px;font-weight:600;z-index:70;pointer-events:none;background:color-mix(in srgb,var(--bg) 92%,transparent)}
.statusbar span{display:flex;gap:5px;align-items:center}
.stack{position:absolute;inset:0}
.scr{position:absolute;inset:0;background:var(--bg);overflow:hidden}
.scroll{height:100%;overflow-y:auto;overflow-x:hidden;scrollbar-width:none;overscroll-behavior:contain}
.scroll::-webkit-scrollbar{display:none}
.pad{padding:calc(var(--sb) + 6px) 20px 132px;display:flex;flex-direction:column;gap:20px}
.pad.cta{padding-bottom:124px}
.pad.chat{padding-bottom:150px}
.scr.in-fwd{animation:inFwd 420ms var(--enter) both}
.scr.out-fwd{animation:outFwd 420ms var(--enter) both}
.scr.in-back{animation:inBack 380ms var(--enter) both}
.scr.out-back{animation:outBack 380ms var(--enter) both;z-index:2}
.scr.in-fade{animation:fadeIn 300ms var(--std) both}
@keyframes inFwd{from{transform:translateX(100%)}}
@keyframes outFwd{to{transform:translateX(-28%);filter:brightness(.9)}}
@keyframes inBack{from{transform:translateX(-28%)}}
@keyframes outBack{to{transform:translateX(100%)}}
@keyframes fadeIn{from{opacity:0}}
.app :is(button,[data-act]){transition:transform 380ms var(--spring),background-color 200ms linear,color 200ms linear,box-shadow 200ms linear,opacity 200ms linear;-webkit-tap-highlight-color:transparent}
.app :is(button,[data-act]):active{transform:scale(.96);transition:transform 90ms var(--std)}
.app .noscale:active{transform:none}
.rv{animation:rise 500ms var(--enter) both}
.rv:nth-child(2){animation-delay:70ms}.rv:nth-child(3){animation-delay:140ms}.rv:nth-child(4){animation-delay:210ms}.rv:nth-child(5){animation-delay:280ms}.rv:nth-child(n+6){animation-delay:350ms}
@keyframes rise{from{opacity:0;transform:translateY(12px)}}

.t-big{font-size:40px;line-height:44px;font-weight:700;letter-spacing:-1.6px;font-variant-numeric:tabular-nums}
.t-1{font-size:30px;line-height:34px;font-weight:600;letter-spacing:-1.1px;margin:0}
.t-2{font-size:24px;line-height:30px;font-weight:700;letter-spacing:-.8px;font-variant-numeric:tabular-nums}
.t-3{font-size:18px;line-height:24px;font-weight:600;letter-spacing:-.3px;margin:0}
.t-e{font-size:16px;line-height:22px;font-weight:600}
.t-s{font-size:14px;line-height:20px}
.t-c{font-size:12px;line-height:16px}
.mono{font-family:var(--mono);font-size:12px;line-height:16px}
.c2{color:var(--fg-2)}.c3{color:var(--fg-3)}.c4{color:var(--fg-4)}.ca{color:var(--accent-text)}.cok{color:var(--ok)}.cbad{color:var(--bad)}.cwarn{color:var(--warn)}
.w5{font-weight:500}.w6{font-weight:600}.w7{font-weight:700}
.ell{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.col{display:flex;flex-direction:column}.row{display:flex;align-items:center}
.g2{gap:2px}.g4{gap:4px}.g6{gap:6px}.g8{gap:8px}.g10{gap:10px}.g12{gap:12px}.g14{gap:14px}.g16{gap:16px}.g20{gap:20px}
.grow{flex:1;min-width:0}.between{justify-content:space-between}.wrap{flex-wrap:wrap}.ai-s{align-items:flex-start}.ai-b{align-items:baseline}.self-s{align-self:flex-start}.none{flex:none}.ta-r{text-align:right}

.topbar{display:flex;align-items:center;gap:12px;min-height:44px}
.topbar .tb-t{flex:1;text-align:center;font-size:16px;font-weight:600;min-width:0}
.topbar .tb-t small{display:block;font-size:12.5px;font-weight:400;color:var(--fg-3)}
.cbtn{width:42px;height:42px;border-radius:999px;background:var(--card);display:inline-flex;align-items:center;justify-content:center;flex:none}
.cbtn.acc{background:var(--accent);color:var(--on-accent);box-shadow:var(--sh-fab)}
.cbtn.sm{width:34px;height:34px;background:var(--bg)}
.sec-h{display:flex;align-items:center;justify-content:space-between;gap:8px 12px;min-height:28px;flex-wrap:wrap}
.lbl{font-size:12px;font-weight:600;color:var(--fg-3);letter-spacing:.5px;text-transform:uppercase}
.card{background:var(--card);border-radius:24px;padding:18px}
.card.tonal{background:var(--tonal)}
.card.ink{background:var(--inverse);color:var(--inverse-fg)}
.grp{background:var(--card);border-radius:24px;padding:4px 16px}
.li{position:relative;display:flex;align-items:center;gap:12px;padding:10px 0;min-height:60px;width:100%;text-align:left}
.li + .li::before{content:"";position:absolute;top:0;left:var(--inset,0);right:0;height:1px;background:var(--line)}
.li.hi{--inset:52px}
.li .tt{font-size:15px;line-height:20px;font-weight:500}
.li .mm{font-size:13px;line-height:18px;color:var(--fg-3)}
.li .end{display:flex;flex-direction:column;align-items:flex-end;gap:2px;flex:none}
.amt{font-size:15px;line-height:20px;font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}
.mi{width:40px;height:40px;border-radius:13px;display:inline-flex;align-items:center;justify-content:center;flex:none;background:color-mix(in srgb,var(--tc,var(--accent)) 14%,var(--card));color:var(--tc,var(--accent))}
.mi.sm{width:30px;height:30px;border-radius:10px}.mi.sm svg.lucide{width:16px;height:16px}
.mi.lg{width:52px;height:52px;border-radius:17px}
.mi.neutral{background:var(--bg);color:var(--fg-2)}
.tag{display:inline-flex;align-items:center;gap:4px;height:24px;padding:0 9px;border-radius:999px;font-size:12px;font-weight:600;background:var(--bg);color:var(--fg-2);white-space:nowrap;flex:none}
.tag.ok{background:var(--ok-soft);color:var(--ok)}.tag.warn{background:var(--warn-soft);color:var(--warn)}.tag.bad{background:var(--bad-soft);color:var(--bad)}.tag.ton{background:var(--tonal);color:var(--tonal-fg)}
.tag.lg{height:28px;padding:0 10px;font-size:13px}
.btn{height:52px;border-radius:999px;padding:0 22px;display:inline-flex;align-items:center;justify-content:center;gap:8px;font-size:16px;font-weight:600;white-space:nowrap;flex:none}
.btn.p{background:var(--accent);color:var(--on-accent);box-shadow:var(--sh-fab)}
.btn.t{background:var(--tonal);color:var(--tonal-fg)}
.btn.g{background:var(--card);color:var(--fg)}
.btn.q{background:transparent;color:var(--accent-text);padding:0 10px}
.btn.b{flex:1}
.btn.sm{height:36px;padding:0 14px;font-size:14px;box-shadow:none}
.btn.md{height:44px;padding:0 18px;font-size:15px}
.btn[disabled]{background:var(--track);color:var(--fg-4);box-shadow:none;pointer-events:none}
.link{font-size:14px;font-weight:600;color:var(--accent-text)}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chips.x{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;margin:0 -18px;padding:0 18px}
.chips.x::-webkit-scrollbar{display:none}
.chip{height:34px;padding:0 13px;border-radius:999px;background:var(--card);display:inline-flex;align-items:center;gap:6px;font-size:14px;font-weight:500;flex:none;white-space:nowrap}
.card .chip,.sheet .chip{background:var(--bg)}
.chip.on{background:var(--tonal);color:var(--tonal-fg);font-weight:600}
.chip .ck{width:14px;display:inline-flex;opacity:0;transform:scale(.4);transition:opacity 120ms linear,transform 340ms var(--spring)}
.chip.on .ck{opacity:1;transform:none}
.seg{display:flex;padding:3px;border-radius:999px;background:var(--track);position:relative;flex:none}
.seg button{flex:1;height:30px;padding:0 12px;border-radius:999px;font-size:13px;font-weight:500;color:var(--fg-2);position:relative;z-index:1;white-space:nowrap}
.seg button.on{color:var(--fg);font-weight:600}
.seg .ind{position:absolute;top:3px;bottom:3px;left:0;border-radius:999px;background:var(--card);box-shadow:var(--sh-seg);transition:transform 340ms var(--std),width 340ms var(--std)}
:root[data-theme="dark"] .seg .ind{background:var(--card-2)}
.periods{display:flex;gap:6px}
.periods button{height:28px;padding:0 11px;border-radius:999px;background:var(--bg);font-size:12.5px;font-weight:500}
.periods button.on{background:var(--inverse);color:var(--inverse-fg);font-weight:600}
.kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(104px,1fr));gap:14px 12px}
.kv .k{display:block;font-size:12px;color:var(--fg-3)}
.kv .v{display:block;font-size:15px;font-weight:600;font-variant-numeric:tabular-nums;margin-top:2px;white-space:nowrap}
.hint{display:flex;gap:6px;align-items:flex-start;font-size:12.5px;line-height:17px;color:var(--fg-3)}
.hint svg{margin-top:1px}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12.5px;color:var(--fg-2)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.sw{width:10px;height:10px;border-radius:3px;flex:none;background:var(--c)}
.sw.line{height:2px;border-radius:2px;width:14px}
.sw.dash{height:0;border-top:2px dashed var(--fg-3);background:none;width:14px;border-radius:0}

/* gráfico de linha */
.lc{position:relative;touch-action:pan-y;user-select:none}
.lc svg{display:block;width:100%;height:auto;overflow:visible}
.lc .draw{stroke-dasharray:1;stroke-dashoffset:0;animation:draw 1000ms var(--std) both}
@keyframes draw{from{stroke-dashoffset:1}}
.lc .area{animation:fadeIn 900ms 300ms var(--std) both}
.lc .xh{opacity:0;transition:opacity 120ms linear}
.lc.on .xh{opacity:1}
.tip{position:absolute;top:-6px;transform:translate(-50%,-100%);background:var(--inverse);color:var(--inverse-fg);border-radius:12px;padding:7px 10px;font-size:12px;line-height:16px;white-space:nowrap;pointer-events:none;box-shadow:var(--sh-2);z-index:5}
.tip b{font-weight:600;font-variant-numeric:tabular-nums}
.tip .d{color:var(--inverse-3);font-size:11px}
.xax{display:flex;justify-content:space-between;font-size:11.5px;color:var(--fg-3);margin-top:6px;font-variant-numeric:tabular-nums}
.spark{width:56px;height:22px;flex:none}

/* rosca */
.donut{position:relative;width:150px;height:150px;flex:none}
.donut svg{width:150px;height:150px;display:block}
.donut circle.arc{transition:stroke-width 260ms var(--spring),opacity 200ms linear;animation:arc 900ms var(--std) both;cursor:pointer}
@keyframes arc{from{stroke-dasharray:0 400}}
.donut .ctr{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;pointer-events:none;padding:0 20px}
.donut .ctr b{font-size:15px;white-space:nowrap;font-weight:700;letter-spacing:-.4px;font-variant-numeric:tabular-nums}
.donut .ctr span{font-size:11.5px;color:var(--fg-3)}
.alloc{display:flex;gap:16px;align-items:center}
.alist{display:flex;flex-direction:column;flex:1;min-width:0}
.arow{display:flex;align-items:center;gap:8px;min-height:34px;padding:4px 6px;margin:0 -6px;border-radius:10px;font-size:13.5px;transition:opacity 200ms linear,background-color 200ms linear}
.arow.dim{opacity:.4}

function squarify(items, x, y, w, h) {
  const out = []; let rest = items.slice();
  while (rest.length) {
    const short = Math.min(w, h), row = [rest[0]]; let i = 1;
    const worst = r => { const s = r.reduce((a, b) => a + b.a, 0), mx = Math.max(...r.map(o => o.a)), mn = Math.min(...r.map(o => o.a)); return Math.max(short * short * mx / (s * s), s * s / (short * short * mn)); };
    while (i < rest.length && worst([...row, rest[i]]) <= worst(row)) row.push(rest[i++]);
    const s = row.reduce((a, b) => a + b.a, 0);
    if (w >= h) { const cw = s / h; let cy = y; row.forEach(o => { const ch = o.a / cw; out.push({ ...o, x, y: cy, w: cw, h: ch }); cy += ch; }); x += cw; w -= cw; }
    else { const rh = s / w; let cx = x; row.forEach(o => { const cw = o.a / rh; out.push({ ...o, x: cx, y, w: cw, h: rh }); cx += cw; }); y += rh; h -= rh; }
    rest = rest.slice(i);
  }
  return out;
}
